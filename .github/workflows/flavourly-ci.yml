name: Flavourly CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: bunx tsgo --noEmit
      - run: npm run lint
      - run: npm run typecheck
      - run: bunx vitest run
      - run: npm run build
