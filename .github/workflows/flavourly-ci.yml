name: Flavourly CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx --package @typescript/native-preview tsgo --noEmit
      - run: npx eslint src/lib/intelligence/revenue-employee.server.ts src/lib/intelligence/functions.ts src/lib/intelligence/types.ts src/integrations/supabase/types.ts src/lib/restaurant-profile.functions.ts src/lib/market-intelligence.ts src/routes/login.tsx src/routes/signup.tsx src/routes/dashboard.tsx src/routes/dashboard.approvals.tsx src/routes/dashboard.revenue-employee.tsx
      - run: npm run typecheck
      - run: bunx vitest run
