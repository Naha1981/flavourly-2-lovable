<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title>Flavourly</title>
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9a69"/>
      <stop offset="1" stop-color="#1f5f3d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7cb72"/>
      <stop offset="0.5" stop-color="#b58b24"/>
      <stop offset="1" stop-color="#8c6b16"/>
    </linearGradient>
    <radialGradient id="bg" cx="32%" cy="25%" r="80%">
      <stop offset="0" stop-color="#2f6f4a"/>
      <stop offset="1" stop-color="#123a27"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.3" flood-color="#071d12" flood-opacity=".42"/>
    </filter>
  </defs>

  <!-- Premium circular app badge; transparent outside the circle. -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="29.3" fill="none" stroke="#d8bd61" stroke-opacity=".3" stroke-width="1"/>

  <!-- Stem -->
  <path d="M31.8 43.5V25.2" stroke="url(#gold)" stroke-width="2.7" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Four-tine fork -->
  <path d="M28 10v9.2M31 10v9.2M34 10v9.2M37 10v9.2" stroke="url(#gold)" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M26.5 10v10.2c0 3.1 2.3 5.3 5.5 5.3s5.5-2.2 5.5-5.3V10" fill="none" stroke="url(#gold)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Spoon -->
  <path d="M24.1 13.2c-3.8 2.2-5.1 5.5-3.7 7.5 1.1 1.6 3.6 1.8 5.2.2" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <path d="M24.9 20.6 28 27.7" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Leaf -->
  <path d="M32 47.8c1.2-12.6 7.8-22 18.2-25.7.5 10.8-4.8 21.7-18.2 25.7Z" fill="url(#leaf)" stroke="#86b694" stroke-opacity=".55" stroke-width=".8" filter="url(#shadow)"/>
  <path d="M34.6 44.8c4.6-4 8.6-9.1 11.3-15.2" fill="none" stroke="#b6d7be" stroke-opacity=".72" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M38.1 40.8 34.3 38.5M40.7 37.4l-4-2.1M43 33.7l-3.6-1.7" fill="none" stroke="#b6d7be" stroke-opacity=".48" stroke-width=".8" stroke-linecap="round"/>
</svg>
